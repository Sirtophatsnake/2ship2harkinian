name: generate-builds
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:

  generate-2ship-otr:
    runs-on: ubuntu-22.04
    # The asset step can break on runner/dependency changes; the Windows build then reuses the last published 2ship.o2r
    continue-on-error: true
    steps:
    - name: Git Checkout
      uses: actions/checkout@v6
      with:
        submodules: true
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2.22
      with:
        save: ${{ github.ref_name == github.event.repository.default_branch }}
        key: ${{ runner.os }}-otr-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-otr-ccache-${{ github.ref }}
          ${{ runner.os }}-otr-ccache
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $(cat .github/workflows/apt-deps.txt) libzip-dev zipcmp zipmerge ziptool
    - name: Restore Cached deps folder
      uses: actions/cache/restore@v5
      with:
        key: ${{ runner.os }}-deps-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-deps-${{ github.ref }}-
          ${{ runner.os }}-deps-
        path: deps
    - name: Create deps folder
      run: mkdir -p deps
    - name: Install latest SDL
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        if [ ! -d "deps/SDL2-2.30.3" ]; then
          # libsdl.org first: GitHub release downloads can time out (504)
          wget --tries=5 --waitretry=20 --retry-on-http-error=502,503,504 https://www.libsdl.org/release/SDL2-2.30.3.tar.gz ||
            wget --tries=5 --waitretry=20 --retry-on-http-error=502,503,504 https://github.com/libsdl-org/SDL/releases/download/release-2.30.3/SDL2-2.30.3.tar.gz
          tar -xzf SDL2-2.30.3.tar.gz -C deps
        fi
        cd deps/SDL2-2.30.3
        ./configure --enable-hidapi-libusb
        make -j 10
        sudo make install
        sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/
    - name: Install latest tinyxml2
      run: |
        sudo apt-get remove libtinyxml2-dev
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        if [ ! -d "deps/tinyxml2-10.0.0" ]; then
          wget --tries=5 --waitretry=20 --retry-on-http-error=502,503,504 https://github.com/leethomason/tinyxml2/archive/refs/tags/10.0.0.tar.gz
          tar -xzf 10.0.0.tar.gz -C deps
        fi
        cd deps/tinyxml2-10.0.0
        mkdir -p build
        cd build
        cmake ..
        make
        sudo make install
    - name: Generate 2ship.o2r
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release
        # libultraship downloads stb_image.h from github.com without checking; refill it from a mirror if it is empty
        if [ $(stat -c%s build-cmake/_deps/stb/stb_image.h 2>/dev/null || echo 0) -lt 100000 ]; then
          curl -fsSL --retry 5 -o build-cmake/_deps/stb/stb_image.h https://cdn.jsdelivr.net/gh/nothings/stb@0bc88af4de5fb022db643c2d8e549a0927749354/stb_image.h
        fi
        cmake --build build-cmake --config Release --target Generate2ShipOtr -j3
    - name: Upload 2ship.o2r
      uses: actions/upload-artifact@v7
      with:
        name: 2ship.o2r
        path: 2ship.o2r
        retention-days: 3

  build-windows:
    needs: generate-2ship-otr
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    steps:
    - name: Install dependencies
      run: |
        choco install ninja -y
        Remove-Item -Path "C:\ProgramData\Chocolatey\bin\ccache.exe" -Force -ErrorAction SilentlyContinue
    - name: Git Checkout
      uses: actions/checkout@v6
      with:
        submodules: true
    - name: Configure sccache
      # Only a cache: if its download fails, build without it
      continue-on-error: true
      uses: hendrikmuhs/ccache-action@v1.2.22
      with:
        variant: sccache
        max-size: "2G"
        evict-old-files: job
        save: ${{ github.ref_name == github.event.repository.default_branch }}
        key: ${{ runner.os }}-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ github.ref }}
          ${{ runner.os }}-ccache
    - name: Restore Cached VCPKG folder
      id: restore-cache-vcpkg
      uses: actions/cache/restore@v4
      with:
        key: ${{ runner.os }}-vcpkg-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-${{ github.ref }}-
          ${{ runner.os }}-vcpkg-
        path: vcpkg
    - name: Configure Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
    - name: Download 2ship.o2r
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: 2ship.o2r
        path: build-windows/mm
    - name: Fallback to last published 2ship.o2r
      shell: bash
      run: |
        if [ ! -f build-windows/mm/2ship.o2r ]; then
          mkdir -p build-windows/mm
          curl -fsSL -o build-windows/mm/2ship.o2r https://raw.githubusercontent.com/${{ github.repository }}/windows-build/2ship.o2r
        fi
        ls -l build-windows/mm/2ship.o2r
    - name: Prefill vcpkg downloads
      # Files vcpkg would fetch from github.com URLs that time out; vcpkg reuses them when the SHA512 matches
      shell: bash
      run: |
        if [ ! -f vcpkg/README.md ]; then rm -rf vcpkg; git clone --depth 1 https://github.com/Microsoft/vcpkg.git vcpkg; fi
        mkdir -p vcpkg/downloads
        cp .github/ci-downloads/*.patch vcpkg/downloads/
    - name: Build 2Ship
      env:
        VCPKG_ROOT: ${{github.workspace}}/vcpkg
      run: |
        set $env:PATH="$env:USERPROFILE/.cargo/bin;$env:PATH"
        $launcher = @()
        if (Get-Command sccache -ErrorAction SilentlyContinue) {
          $launcher = @("-DCMAKE_C_COMPILER_LAUNCHER=sccache", "-DCMAKE_CXX_COMPILER_LAUNCHER=sccache")
        }
        cmake -S . -B build-windows -G Ninja -DCMAKE_MAKE_PROGRAM=ninja -DCMAKE_BUILD_TYPE:STRING=Release @launcher
        if ($LASTEXITCODE -ne 0) { exit 1 }
        $stb = "build-windows/_deps/stb/stb_image.h"
        if (-not (Test-Path $stb) -or (Get-Item $stb).Length -lt 100000) {
          Invoke-WebRequest -Uri "https://cdn.jsdelivr.net/gh/nothings/stb@0bc88af4de5fb022db643c2d8e549a0927749354/stb_image.h" -OutFile $stb -MaximumRetryCount 5 -RetryIntervalSec 10
        }
        cmake --build build-windows --config Release --parallel 10

        (cd build-windows && cpack)
        cd ..
        mv _packages/*.zip _packages/2ship-windows.zip
    - name: Unzip package
      run: Expand-Archive -Path _packages/2ship-windows.zip -DestinationPath 2ship-windows
    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: 2ship-windows
        path: 2ship-windows
    - name: Publish build to windows-build branch
      shell: bash
      run: |
        cd 2ship-windows && rm -rf debug
        git init -q && git checkout -q -b windows-build
        git config user.name ci && git config user.email ci@example.com
        git add -A && git commit -qm "Windows build ${{ github.sha }}"
        git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} windows-build
    - name: Save Cache VCPKG folder
      if: ${{ github.ref_name == github.event.repository.default_branch }}
      uses: actions/cache/save@v5
      with:
        key: ${{ steps.restore-cache-vcpkg.outputs.cache-primary-key }}
        path: vcpkg
